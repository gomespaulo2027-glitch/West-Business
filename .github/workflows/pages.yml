name: Deploy West Business to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Prepare static SPA for GitHub Pages
        run: |
          if [ -d ".output/public" ]; then
            cd .output/public
          elif [ -d "dist" ]; then
            cd dist
          else
            echo "No static output directory found."
            exit 1
          fi

          if [ -f "_shell.html" ]; then
            cp _shell.html index.html
            cp _shell.html 404.html
          elif [ -f "index.html" ]; then
            cp index.html 404.html
          else
            echo "No index.html or _shell.html found."
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
